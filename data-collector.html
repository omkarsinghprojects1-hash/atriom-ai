<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Collector Console — Atriom-AI</title>
    <meta name="description" content="Atriom-AI Data Collector Console — secure metrics ingestion, pipeline log submission, and stream configuration interface." />
    <meta name="robots" content="noindex, nofollow" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,400&family=Outfit:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f7f6f2;
            --bg2: #f0ede6;
            --surface: #ffffff;
            --border: #e2ddd6;
            --border2: #cdc8c0;
            --accent: #2d5a3d;
            --accent-lt: #e8f0ea;
            --accent2: #7a9e87;
            --ink: #1a1a18;
            --ink2: #3d3d3a;
            --muted: #8a8880;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* ── TOP BAR ── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: rgba(247, 246, 242, 0.97);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }

        .powered-by {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            color: var(--muted);
            white-space: nowrap;
        }
        .powered-by .brand-link {
            color: var(--accent);
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .powered-by .brand-link:hover { opacity: 0.75; }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-lt);
            padding: 0.18rem 0.55rem;
            border-radius: 2px;
        }
        .status-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 480px) {
            .status-pill { display: none; }
        }

        /* ── IFRAME FULL-BLEED ── */
        .frame-wrap {
            position: fixed;
            top: 38px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .frame-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

    <header class="topbar" aria-label="Data Collector navigation">
        <span class="powered-by">powered by <a href="index.html" class="brand-link" aria-label="Back to Atriom-AI">Atriom-AI</a></span>

        <div class="status-pill" aria-label="Interface active">
            <span class="status-dot" aria-hidden="true"></span>
            Live
        </div>
    </header>

    <main class="frame-wrap">
        <iframe
            src="https://omkarsinghprojects1-hash.github.io/atriom_ai_data_collector/"
            title="Atriom-AI Data Collector Application Node"
            allow="clipboard-write"
            loading="eager">
        </iframe>
    </main>

</body>
</html>
